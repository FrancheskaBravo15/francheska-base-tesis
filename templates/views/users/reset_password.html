{% extends 'base.html' %}
{% block title %}Nueva Contraseña - Shirley Buenaño{% endblock %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                 style="width:70px;height:70px;background:#F4ECF1;">
                <i class="bi bi-lock-fill text-danger" style="font-size:2rem;"></i>
            </div>
            <h4 class="fw-bold">Nueva Contraseña</h4>
            <p class="text-muted small">Elige una contraseña segura de al menos 8 caracteres.</p>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nueva Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input type="password" class="form-control border-start-0" name="new_password"
                                   placeholder="Mínimo 8 caracteres" minlength="8" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirmar Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock-fill text-muted"></i>
                            </span>
                            <input type="password" class="form-control border-start-0" name="confirm_password"
                                   placeholder="Repite la contraseña" minlength="8" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-danger btn-lg">
                            <i class="bi bi-check-lg me-2"></i>Guardar Nueva Contraseña
                        </button>
                    </div>
                    <div class="text-center">
                        <small class="text-muted">
                            <a href="{{ url_for('users.login') }}" class="text-danger text-decoration-none">
                                <i class="bi bi-arrow-left me-1"></i>Volver al Login
                            </a>
                        </small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
